<button class="id-ams-epic-parent" type="button" (click)="onClick()" [class.selected]="selected" [style.--accent]="color" [attr.aria-label]="name">
  <div class="id-ams-epic">ID: {{ sourceId }}</div>
  <b class="applied-epic">{{ name }}</b>
  <div class="group-child"></div>
  <div class="group-item"></div>
</button>
